name: Documentation drift

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Inspect recent code/doc drift
        run: node scripts/documentation-drift.mjs
      - name: Add report to workflow summary
        shell: bash
        run: cat documentation-drift-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: documentation-drift-report
          path: documentation-drift-report.md
          retention-days: 7
