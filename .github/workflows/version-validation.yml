name: Version validation

on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate version and release notes
        env:
          VERSION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERSION_RELEASE: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        run: node scripts/validate-version.mjs
      - name: Test lifecycle safeguards
        run: node --test tests/*.test.mjs
