name: Agent stack validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate canonical agent stack
        run: node scripts/validate-agent-stack.mjs
