name: Security checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3             detect --source=/repo --redact --exit-code 1

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Scan high-severity findings
        run: semgrep scan --config auto --severity ERROR --error

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Audit Node production dependencies when present
        shell: bash
        run: |
          if [ -f package.json ]; then
            if [ ! -f package-lock.json ]; then
              npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            fi
            npm audit --omit=dev --audit-level=high
          else
            echo "No package.json; skipping npm audit."
          fi
      - name: Audit Python requirements when present
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --disable-pip-version-check pip-audit
            pip-audit -r requirements.txt
          else
            echo "No root requirements.txt; skipping pip-audit."
          fi
