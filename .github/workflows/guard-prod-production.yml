name: Production branch guard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-release-source:
    name: develop-only production source
    runs-on: ubuntu-latest
    steps:
      - name: Require same-repository develop branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::Only develop may merge into prod. Current head: $HEAD_REF"
            exit 1
          fi
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Production PR must originate from this repository's develop branch."
            exit 1
          fi

      - name: Require production approval label
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          node -e 'const labels=JSON.parse(process.env.LABELS_JSON); if(!labels.includes("production-approved")){console.error("::error::Missing production-approved label."); process.exit(1)}'
